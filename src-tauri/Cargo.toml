[package]
name = "gamehub"
version = "0.1.0"
description = "Open-source game library manager"
authors = ["Dennis"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
rusqlite = { version = "0.31", features = ["bundled"] }
keyvalues-serde = "0.2"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
once_cell = "1.19"
open = "5.3"
tauri-plugin-dialog = "2.7.3"
crc32fast = "1.4"
async-trait = "0.1"
urlencoding = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1.1"
regex = "1"

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11.2"

[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
